name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # package-lock.json이 생기면 `npm ci`로 바꾼다 (로컬에서 npm install 후 커밋)
      - run: npm install --no-audit --no-fund
      - name: 콘텐츠 검증
        run: npm run validate
      - name: 테스트 (앱)
        run: npm test
      - name: 테스트 (스크립트)
        run: node --test ../scripts/radar.test.mjs ../scripts/watchdog.test.mjs
      - name: 빌드 (web)
        run: npm run build
        env:
          VITE_CHANNEL: web
      - name: 레이더 미리보기 (실제 RSS, 이슈는 건드리지 않음)
        run: node ../scripts/radar.mjs
        continue-on-error: true
