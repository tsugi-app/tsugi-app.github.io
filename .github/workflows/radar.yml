name: Candidate radar

on:
  schedule:
    # 10분마다 (정각 혼잡을 피해 3분 어긋나게).
    # RSS는 최신 200건뿐이라 평일엔 2~3시간치만 담기는데, GitHub 예약 실행은 부하에 따라
    # 건너뛰어져 '매시간'으로 두면 실제로는 4~7시간 간격이 됐다 (2026-11-07~08 실측).
    # 자주 걸어 둬야 빈틈이 줄어든다. 중복은 이슈의 기존 링크로 거른다.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PR TIMES에서 후보 수집 → 이번 주 레이더 이슈에 추가
        run: node scripts/radar.mjs --issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
