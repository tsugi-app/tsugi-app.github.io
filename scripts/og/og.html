<!doctype html>
<!--
  공유 미리보기 기본 이미지(app/public/og.png, 1200×630)의 원본.
  색·글꼴은 tokens.css에서 가져온다. 고친 뒤 리포 루트에서 다시 만든다:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --disable-gpu --hide-scrollbars \
      --window-size=1200,630 --virtual-time-budget=5000 --screenshot=app/public/og.png scripts/og/og.html
  카톡·X가 정사각형으로 자를 수 있어 글자는 가운데 630px 안에 둔다.
-->
<html lang="ko">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../app/src/styles/tokens.css" />
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
/>
<style>
  html, body { margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    position: relative;
  }
  .center {
    position: absolute;
    left: 0; right: 0; top: 118px;
    text-align: center;
  }
  .mark {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: 0.5em;
    color: var(--ink-2);
    margin-left: 0.5em;
  }
  .logo {
    font-size: 148px;
    font-weight: 800;
    letter-spacing: -0.04em;
    color: var(--brand);
    line-height: 1.05;
    margin-top: 6px;
  }
  .tag {
    font-size: 40px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-top: 18px;
  }
  /* 이미 짠 일정(회색 역) 사이에 끼우는 한 곳(남색 역) — 노선도 모티프 */
  svg { position: absolute; left: 0; bottom: 0; }
  .rail { stroke: var(--line); stroke-width: 10; stroke-linecap: round; }
  .rail-on { stroke: var(--brand); stroke-width: 10; stroke-linecap: round; }
  .stop { fill: var(--surface); stroke: var(--ink-2); stroke-width: 6; }
  .pick { fill: var(--brand); }
  .pick-ring { fill: var(--surface); }
  .plus { fill: var(--surface); font: 800 30px var(--font); }
</style>
</head>
<body>
  <div class="center">
    <div class="mark">TSUGI · 次</div>
    <div class="logo">츠기</div>
    <div class="tag">다음 일본 여행에 넣을 한 곳</div>
  </div>
  <svg width="1200" height="150" viewBox="0 0 1200 150" aria-hidden="true">
    <line class="rail" x1="-20" y1="75" x2="1220" y2="75" />
    <line class="rail-on" x1="430" y1="75" x2="770" y2="75" />
    <circle class="stop" cx="130" cy="75" r="17" />
    <circle class="stop" cx="430" cy="75" r="17" />
    <circle class="stop" cx="770" cy="75" r="17" />
    <circle class="stop" cx="1070" cy="75" r="17" />
    <circle class="pick" cx="600" cy="75" r="36" />
    <text class="plus" x="600" y="86" text-anchor="middle">+1</text>
  </svg>
</body>
</html>
