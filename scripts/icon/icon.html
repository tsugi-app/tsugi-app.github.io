<!doctype html>
<!--
  대표 아이콘(앱 아이콘·파비콘·홈 화면 아이콘) PNG를 만드는 틀. 원본은 app/public/icon.svg (1024 정사각, 후보 B "아이 노선").
  색은 tokens.css의 아이 600(바탕)·500(바깥 노선)과 흰색. og.png 하단 노선과 같은 그림이다.
  고친 뒤 리포 루트에서 크기마다 다시 만든다 (N = 32·180·192·512·1024):
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --disable-gpu --hide-scrollbars \
      --window-size=N,N --screenshot=app/public/icon-N.png scripts/icon/icon.html
  180은 apple-touch-icon.png, 32는 favicon-32.png로 이름을 바꿔 둔다.
  모서리는 깎지 않는다(정사각 그대로). iOS·안드로이드·앱인토스가 각자 둥글게 자른다.
-->
<html lang="ko">
<head>
<meta charset="UTF-8" />
<style>
  html, body { margin: 0; overflow: hidden; }
  img { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body><img src="../../app/public/icon.svg" alt="" /></body>
</html>
