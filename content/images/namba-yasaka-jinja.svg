모티프: 단순한 맞배지붕 하나와 처마에 건 굵은 금줄
근거: 오사카 관광국 페이지 https://osaka-info.jp/experience/ja/osaka/spot/246 주택가 안의 오래된 신사, 지금의 본전은 1974년 건립
피한 것: 도리이, 사자 머리 무대(관광 페이지에 없음), 건물 외관 재현, 글자
제작: Claude Opus 5.5 · 2026-11-12
</desc>
