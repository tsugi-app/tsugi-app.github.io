<title>hakata-dentou-kougeikan</title>
<desc>
모티프: 바닥 위에서 도는 팽이 하나 (하카타 고마)
근거: 공식 소개 "하카타오리·하카타 인형과 함께 하카타 마게모노·하카타 고마·하카타 하사미·하카타 하리코를 다룬다"
피한 것: 하카타 인형 얼굴(얼굴 금지), 박다오리 띠 무늬 재현(기간 한정 행사)
제작: Claude Opus 5.5 · 2026-11-10
</desc>
