<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
<title>omotesando-ami-paris-cafe</title>
<desc>
모티프: 꽃이 놓인 발코니와 은은한 아연 지붕을 얹은 파리 오스만 양식 정면, 하트 풍선 하나
근거: 브랜드 보도자료 https://prtimes.jp/main/html/rd/p/000000060.000087547.html "パリのオスマン建築を想起させるファサード", "花々が飾られたバルコニー", "柔らかく輝く亜鉛調の屋根", "Ami de Cœur" 하트 벌룬
피한 것: 브랜드 로고·하트 마크 그대로의 형태, 파리 거리 표지판(글자), 실제 외관의 사실적 재현, 빨강(팔레트 밖이라 하트는 겨자로)
제작: Claude Opus 5.5 · 2026-11-10
</desc>
